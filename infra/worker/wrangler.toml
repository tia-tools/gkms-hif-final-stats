# The page as a Worker with static assets only: no code of its own runs. The card data and the
# images come from gkms-library's address, fetched by the browser (docs/plans/EXECPLAN_LIBRARY_DATA.md,
# decision L5). The name stays the deployed Worker's, so a deploy updates it rather than creating one.
name = "gkms-hif-final-stats"
compatibility_date = "2026-09-01"

# Custom domain (decision G34): Cloudflare creates and manages the DNS record when this deploys,
# since the tia.run zone is in the same account. One single-level subdomain per tia-tools app: the
# zone's free Universal SSL certificate covers no second level.
routes = [
  { pattern = "gkms-hif-final-stats.tia.run", custom_domain = true }
]

# The built page (`bun run build` at the repository root writes dist/), served for every path.
[assets]
directory = "../../dist"
